<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Type — Body & Labels</title>
<link rel="stylesheet" href="../fonts/fonts.css" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; padding: 20px; background: var(--bg-0); }
  .row { display: grid; grid-template-columns: 80px 1fr; gap: 16px; align-items: baseline; padding: 8px 0; border-bottom: 1px dashed var(--border); }
  .label { font: 500 11px/1 var(--font-mono); color: var(--text-2); }
</style>
</head>
<body>
  <div class="row"><span class="label">16 body-lg</span><span class="body-lg">Generate an API key and start shipping requests in under a minute.</span></div>
  <div class="row"><span class="label">14 body</span><span class="body">Default body copy size for tables, forms, descriptions.</span></div>
  <div class="row"><span class="label">14 muted</span><span class="body muted">Last refreshed 2 minutes ago · auto-syncs every 30s</span></div>
  <div class="row"><span class="label">12 subtle</span><span class="text-12 subtle">Tertiary metadata · region · request id</span></div>
  <div class="row"><span class="label">12 eyebrow</span><span class="eyebrow">Usage this period</span></div>
</body>
</html>
