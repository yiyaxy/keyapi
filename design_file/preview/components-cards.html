<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Components — Cards & Stats</title>
<link rel="stylesheet" href="../fonts/fonts.css" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; padding: 16px; background: var(--bg-0); display:grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .card { background: var(--bg-1); border: 1px solid var(--border); border-radius: var(--r-md); padding: 16px; }
  .eyebrow { font: 500 11px/14px var(--font-sans); color: var(--text-1); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; }
  .num { font-family: var(--font-sans); font-variant-numeric: tabular-nums; font-weight: 600; color: var(--text-0); font-size: 28px; line-height: 32px; letter-spacing: -0.01em; }
  .delta { font: 500 12px/14px var(--font-sans); margin-top: 6px; }
  .up { color: var(--success); }
  .down { color: var(--danger); }
  .spark { display:flex; align-items:end; gap:2px; height: 24px; margin-top: 10px; }
  .spark span { display:block; width:5px; background: var(--accent); border-radius:1px; opacity: 0.45; }
  .ccy { color: var(--text-1); font-weight: 500; }
</style>
</head>
<body>
<div class="card">
  <div class="eyebrow">Balance</div>
  <div class="num"><span class="ccy">$</span>1,284<span class="ccy">.50</span></div>
  <div class="delta up">↑ $42.10 added today</div>
</div>
<div class="card">
  <div class="eyebrow">This month</div>
  <div class="num"><span class="ccy">$</span>284<span class="ccy">.12</span></div>
  <div class="spark">
    <span style="height:30%"></span><span style="height:50%"></span><span style="height:42%"></span>
    <span style="height:78%"></span><span style="height:60%"></span><span style="height:88%;opacity:1"></span>
  </div>
</div>
<div class="card">
  <div class="eyebrow">Tokens · 30d</div>
  <div class="num">9,432,108</div>
  <div class="delta down">↓ 4.2% vs prev period</div>
</div>
</body>
</html>
