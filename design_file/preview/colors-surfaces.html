<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Colors — Surfaces</title>
<link rel="stylesheet" href="../fonts/fonts.css" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; padding: 16px; background: var(--bg-0); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .swatch {
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    overflow: hidden;
    background: var(--bg-1);
  }
  .chip { height: 64px; }
  .meta { padding: 8px 10px; }
  .name { font: 600 12px/16px var(--font-sans); color: var(--text-0); }
  .val  { font-family: var(--font-mono); font-size: 11px; color: var(--text-1); margin-top: 2px; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; }
  .pair > div { padding: 8px 10px; }
  .pair .light { background: oklch(0.99 0.002 260); color: oklch(0.20 0.008 260); }
  .pair .dark  { background: oklch(0.14 0.006 260); color: oklch(0.97 0.003 260); }
  .pair .label { font: 600 11px/14px var(--font-sans); }
  .pair .hex   { font-family: var(--font-mono); font-size: 10px; opacity: 0.7; margin-top: 2px; }
</style>
</head>
<body>
<div class="grid">
  <div class="swatch">
    <div class="pair">
      <div class="light"><div class="label">bg-0</div><div class="hex">page</div></div>
      <div class="dark"><div class="label">bg-0</div><div class="hex">page</div></div>
    </div>
  </div>
  <div class="swatch">
    <div class="pair">
      <div class="light" style="background:oklch(0.97 0.003 260)"><div class="label">bg-1</div><div class="hex">card</div></div>
      <div class="dark" style="background:oklch(0.17 0.006 260)"><div class="label">bg-1</div><div class="hex">card</div></div>
    </div>
  </div>
  <div class="swatch">
    <div class="pair">
      <div class="light" style="background:oklch(0.94 0.004 260)"><div class="label">bg-2</div><div class="hex">inset / code</div></div>
      <div class="dark" style="background:oklch(0.21 0.006 260)"><div class="label">bg-2</div><div class="hex">inset / code</div></div>
    </div>
  </div>
  <div class="swatch">
    <div class="pair">
      <div class="light" style="background:oklch(0.91 0.005 260)"><div class="label">bg-3</div><div class="hex">hover-on-card</div></div>
      <div class="dark" style="background:oklch(0.24 0.007 260)"><div class="label">bg-3</div><div class="hex">hover-on-card</div></div>
    </div>
  </div>
</div>
</body>
</html>
