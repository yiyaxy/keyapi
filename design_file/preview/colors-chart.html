<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Colors — Chart palette</title>
<link rel="stylesheet" href="../fonts/fonts.css" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; padding: 16px; background: var(--bg-0); }
  .row { display: flex; gap: 6px; align-items: center; margin-bottom: 12px; }
  .sw { width: 64px; height: 56px; border-radius: var(--r-sm); display:flex; align-items:flex-end; padding: 6px; font: 600 10px/1 var(--font-mono); color: rgba(255,255,255,0.85); }
  .legend { font: 500 11px/14px var(--font-sans); color: var(--text-1); margin-bottom: 6px; }
  .demo { display: flex; align-items: end; gap: 4px; height: 64px; padding: 0 4px; border-bottom: 1px solid var(--border); }
  .bar { width: 12px; border-radius: 2px 2px 0 0; }
</style>
</head>
<body>
<div class="legend">data-0 → data-7 · semantic, never hardcoded</div>
<div class="row">
  <div class="sw" style="background:oklch(0.55 0.14 240);">0</div>
  <div class="sw" style="background:oklch(0.62 0.15 160);">1</div>
  <div class="sw" style="background:oklch(0.65 0.16 60);">2</div>
  <div class="sw" style="background:oklch(0.55 0.18 350);">3</div>
  <div class="sw" style="background:oklch(0.55 0.14 290);">4</div>
  <div class="sw" style="background:oklch(0.65 0.10 200);">5</div>
  <div class="sw" style="background:oklch(0.50 0.08 30);">6</div>
  <div class="sw" style="background:oklch(0.45 0.05 260);">7</div>
</div>
<div class="legend">Stacked bar example · token usage by model</div>
<div class="demo">
  <div class="bar" style="height:62%; background:oklch(0.55 0.14 240);"></div>
  <div class="bar" style="height:46%; background:oklch(0.62 0.15 160);"></div>
  <div class="bar" style="height:78%; background:oklch(0.65 0.16 60);"></div>
  <div class="bar" style="height:38%; background:oklch(0.55 0.18 350);"></div>
  <div class="bar" style="height:54%; background:oklch(0.55 0.14 290);"></div>
  <div class="bar" style="height:30%; background:oklch(0.65 0.10 200);"></div>
  <div class="bar" style="height:42%; background:oklch(0.50 0.08 30);"></div>
  <div class="bar" style="height:24%; background:oklch(0.45 0.05 260);"></div>
</div>
</body>
</html>
