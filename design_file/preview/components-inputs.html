<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Components — Inputs</title>
<link rel="stylesheet" href="../fonts/fonts.css" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; padding: 16px; background: var(--bg-0); display:grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
  .field { display:flex; flex-direction:column; gap:4px; }
  label { font: 500 12px/16px var(--font-sans); color: var(--text-1); }
  .input, .select { padding: 7px 10px; background: var(--bg-1); border: 1px solid var(--border); border-radius: var(--r-sm); font: 400 13px/18px var(--font-sans); color: var(--text-0); transition: border-color 120ms; }
  .input:focus, .select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in oklab, var(--accent) 20%, transparent); }
  .input.invalid { border-color: var(--danger); }
  .err { font: 500 12px/14px var(--font-sans); color: var(--danger); display:flex; gap:4px; align-items:center; }
  .help { font: 400 11px/14px var(--font-sans); color: var(--text-2); }
  .with-icon { position: relative; }
  .with-icon .input { padding-left: 30px; }
  .with-icon svg { position:absolute; left:9px; top:50%; transform: translateY(-50%); color: var(--text-2); width:14px; height:14px; }
  .toggle { display:flex; align-items:center; gap:8px; }
  .switch { width: 32px; height: 18px; background: var(--accent); border-radius: 999px; position:relative; }
  .switch::after { content:''; position:absolute; right:2px; top:2px; width:14px; height:14px; background: white; border-radius: 999px; }
</style>
</head>
<body>
  <div class="field">
    <label>Key name</label>
    <input class="input" value="prod-backend" />
    <span class="help">Used in logs and billing exports.</span>
  </div>
  <div class="field">
    <label>Search</label>
    <div class="with-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
      <input class="input" placeholder="Find a model…" />
    </div>
  </div>
  <div class="field">
    <label>Quota limit</label>
    <input class="input invalid" value="abc" />
    <span class="err">⚠ Must be a positive number</span>
  </div>
  <div class="field">
    <label>Auto-renew subscription</label>
    <div class="toggle"><div class="switch"></div><span class="help">Renews on the 1st each month</span></div>
  </div>
</body>
</html>
