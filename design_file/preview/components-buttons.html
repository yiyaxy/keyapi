<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Components — Buttons</title>
<link rel="stylesheet" href="../fonts/fonts.css" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; padding: 16px; background: var(--bg-0); display:flex; flex-direction:column; gap: 12px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .lbl { font: 500 11px/1 var(--font-mono); color: var(--text-2); width: 80px; }
  .btn { display: inline-flex; align-items:center; gap:6px; padding: 7px 14px; border-radius: var(--r-sm); font: 500 13px/1 var(--font-sans); border: 1px solid transparent; cursor: pointer; transition: all 120ms cubic-bezier(0.22,1,0.36,1); }
  .btn-primary   { background: var(--primary); color: var(--primary-fg); }
  .btn-primary:hover { background: var(--primary-hover); }
  .btn-secondary { background: var(--bg-1); color: var(--text-0); border-color: var(--border); }
  .btn-secondary:hover { background: var(--bg-2); border-color: var(--border-strong); }
  .btn-ghost { background: transparent; color: var(--text-0); }
  .btn-ghost:hover { background: var(--bg-2); }
  .btn-link { background: transparent; color: var(--accent); padding: 7px 4px; }
  .btn-link:hover { color: var(--accent-hover); text-decoration: underline; }
  .btn-danger { background: var(--danger); color: white; }
  .btn-sm { padding: 4px 10px; font-size: 12px; }
  .btn-icon { padding: 7px; }
  svg { width: 14px; height: 14px; }
</style>
</head>
<body>
  <div class="row"><span class="lbl">Primary</span>
    <button class="btn btn-primary">充值 Top up</button>
    <button class="btn btn-primary btn-sm">New key</button>
    <button class="btn btn-primary" style="opacity:0.5;cursor:not-allowed">Disabled</button>
  </div>
  <div class="row"><span class="lbl">Secondary</span>
    <button class="btn btn-secondary">Export CSV</button>
    <button class="btn btn-secondary btn-sm">Cancel</button>
    <button class="btn btn-secondary btn-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button>
  </div>
  <div class="row"><span class="lbl">Ghost / Link</span>
    <button class="btn btn-ghost">Skip</button>
    <button class="btn btn-link">View docs →</button>
    <button class="btn btn-danger">Revoke</button>
  </div>
</body>
</html>
