<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Type — Display & Headings</title>
<link rel="stylesheet" href="../fonts/fonts.css" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; padding: 20px; background: var(--bg-0); }
  .row { display: grid; grid-template-columns: 70px 1fr; gap: 16px; align-items: baseline; padding: 6px 0; border-bottom: 1px dashed var(--border); }
  .label { font: 500 11px/1 var(--font-mono); color: var(--text-2); padding-top: 6px; }
</style>
</head>
<body>
  <div class="row"><span class="label">48 / 600</span><div class="text-48" style="font-weight:600">Money is the hero.</div></div>
  <div class="row"><span class="label">32 / 600</span><div class="text-32" style="font-weight:600">Dashboard heading</div></div>
  <div class="row"><span class="label">24 / 600</span><div class="text-24" style="font-weight:600">Section title</div></div>
  <div class="row"><span class="label">20 / 600</span><div class="text-20" style="font-weight:600">Card heading</div></div>
  <div class="row"><span class="label">18 / 600</span><div class="text-18" style="font-weight:600">Subsection</div></div>
</body>
</html>
