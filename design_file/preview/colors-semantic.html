<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Colors — Semantic</title>
<link rel="stylesheet" href="../fonts/fonts.css" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; padding: 16px; background: var(--bg-0); display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .swatch { border: 1px solid var(--border); border-radius: var(--r-md); overflow: hidden; background: var(--bg-1); }
  .chip { height: 56px; display:flex; align-items:center; justify-content:center; font: 600 12px/1 var(--font-sans); }
  .pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: var(--r-pill); font: 500 11px/14px var(--font-sans); margin: 8px 8px 0; }
  .meta { padding: 6px 12px 12px; }
  .name { font: 600 12px/16px var(--font-sans); color: var(--text-0); }
  .desc { font: 400 11px/14px var(--font-sans); color: var(--text-1); margin-top: 2px; }
  .ico { width: 10px; height: 10px; border-radius: 99px; }
</style>
</head>
<body>
<div class="swatch">
  <div class="chip" style="background:oklch(0.55 0.20 25); color:white;">Danger</div>
  <span class="pill" style="background:oklch(0.95 0.04 25); color:oklch(0.45 0.18 25);"><span class="ico" style="background:oklch(0.55 0.20 25)"></span>Failed · 401</span>
  <div class="meta"><div class="name">--danger</div><div class="desc">Errors only. Always paired with icon.</div></div>
</div>
<div class="swatch">
  <div class="chip" style="background:oklch(0.70 0.16 75); color:oklch(0.18 0.05 75);">Warn</div>
  <span class="pill" style="background:oklch(0.96 0.05 75); color:oklch(0.45 0.14 75);"><span class="ico" style="background:oklch(0.70 0.16 75)"></span>Quota 80%</span>
  <div class="meta"><div class="name">--warn</div><div class="desc">Threshold crossings, soft alerts.</div></div>
</div>
<div class="swatch">
  <div class="chip" style="background:oklch(0.60 0.13 155); color:white;">Success</div>
  <span class="pill" style="background:oklch(0.95 0.04 155); color:oklch(0.40 0.10 155);"><span class="ico" style="background:oklch(0.60 0.13 155)"></span>Paid · USD 50</span>
  <div class="meta"><div class="name">--success</div><div class="desc">Payment / job complete.</div></div>
</div>
<div class="swatch">
  <div class="chip" style="background:oklch(0.60 0.12 230); color:white;">Info</div>
  <span class="pill" style="background:oklch(0.95 0.03 230); color:oklch(0.40 0.10 230);"><span class="ico" style="background:oklch(0.60 0.12 230)"></span>Cached</span>
  <div class="meta"><div class="name">--info</div><div class="desc">Neutral notices, hints.</div></div>
</div>
</body>
</html>
