server {
    listen 80;
    listen [::]:80;
    server_name lob.cymoon.cn;

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS - 反代到 LobeHub 容器
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name lob.cymoon.cn;

    # ---------- TLS ----------
    ssl_certificate     /data/service/openresty/conf/cert/fullcymoon.pem;
    ssl_certificate_key /data/service/openresty/conf/cert/fullcymoonkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ---------- 安全头 ----------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # 注意：LobeHub 部分功能（插件 iframe）需要相对宽松的 frame 策略，
    # 这里不设 X-Frame-Options，由应用自身控制

    # ---------- 上传 / 日志 ----------
    client_max_body_size 100m;
    client_body_buffer_size 128k;
    access_log /data/service/openresty/logs/lob.cymoon.cn.access.log;
    error_log  /data/service/openresty/logs/lob.cymoon.cn.error.log warn;

    # ---------- 反代到 LobeHub ----------
    location / {
        proxy_pass http://127.0.0.1:13210;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # WebSocket / SSE 升级（Next.js 流式回复必需）
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 流式响应关 buffer（聊天 SSE / 大模型长回复）
        proxy_buffering         off;
        proxy_cache             off;
        proxy_request_buffering off;

        # 长连接超时
        proxy_connect_timeout 60s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }
}
