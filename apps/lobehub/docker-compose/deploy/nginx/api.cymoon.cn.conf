server {
    listen 80;
    listen [::]:80;
    server_name api.cymoon.cn;

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS - 反代到 keyapi（new-api）
#
# 设计要点：
#   - 域名前缀 "api" 已在 keyapi 的 TenantResolve 中显式 skip（middleware/tenant.go:49），
#     所以 LobeHub server-side fetch 这里不会被错误解析成租户。
#     租户由 sk-token 的 TenantId 字段识别（TokenAuth 兜底注入 ctx）。
#   - 核心路径是 /api/* 与 /v1/* （LLM 推理、SSE 流式）。
#   - 同时支持 WebSocket（OpenAI Realtime API 走 Sec-WebSocket-Protocol）。
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.cymoon.cn;

    # ---------- TLS ----------
    ssl_certificate     /data/service/openresty/conf/cert/fullcymoon.pem;
    ssl_certificate_key /data/service/openresty/conf/cert/fullcymoonkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ---------- 安全头 ----------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    # API 端点不需要被 iframe 嵌入
    add_header X-Frame-Options "DENY" always;

    # ---------- 上传 ----------
    # 多模态推理上传图片/音频/文档；100m 通常够用，按业务可调大
    client_max_body_size 100m;
    client_body_buffer_size 256k;
    # SSE / 长响应不缓存到磁盘
    proxy_request_buffering off;

    # ---------- 日志 ----------
    # 启用前确保 /data/service/openresty/logs 目录存在
    #access_log /data/service/openresty/logs/api.cymoon.cn.access.log;
    #error_log  /data/service/openresty/logs/api.cymoon.cn.error.log warn;

    # ---------- 反代到 keyapi ----------
    # 默认监听 :3000；若你的 keyapi 端口不同，改这里
    location / {
        proxy_pass http://127.0.0.1:3000;

        # 透传 Host：让 keyapi 看到 "api.cymoon.cn"，命中 TenantResolve 的 skip 列表
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # WebSocket / SSE 升级（OpenAI Realtime / 流式响应必需）
        # 与 lob.cymoon.cn.conf 一致：硬编码 Connection: upgrade。
        # 适合"绝大多数请求是 HTTP，少量 WS"的场景；如要严格区分，
        # 改用 map $http_upgrade $connection_upgrade 即可（注意 http
        # 块里别和已有 map 重复定义）。
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 流式响应关 buffer（聊天 SSE / 大模型长回复）
        proxy_buffering off;
        proxy_cache     off;

        # LLM 推理可能很久；按业务调
        proxy_connect_timeout 60s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }
}
