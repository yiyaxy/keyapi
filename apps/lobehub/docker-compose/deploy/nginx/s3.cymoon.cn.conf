server {
    listen 80;
    listen [::]:80;
    server_name s3.cymoon.cn;

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS - 反代到 RustFS（S3 兼容存储）
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name s3.cymoon.cn;

    # ---------- TLS ----------
    ssl_certificate     /data/service/openresty/conf/cert/fullcymoon.pem;
    ssl_certificate_key /data/service/openresty/conf/cert/fullcymoonkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ---------- 安全头 ----------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # 注意：S3 是文件服务，不加 X-Frame-Options / X-Content-Type-Options，
    # 否则 LobeHub 内嵌图片可能被浏览器拦截

    # ---------- 上传 ----------
    # ⚠️ S3 可能上传大文件，必须放开 body 限制
    client_max_body_size 0;             # 0 = 不限
    client_body_buffer_size 1m;
    proxy_request_buffering off;        # 大文件流式直传，不缓存到磁盘

    # ---------- 日志 ----------
    #access_log /data/service/openresty/logs/s3.cymoon.cn.access.log;
    #error_log  /data/service/openresty/logs/s3.cymoon.cn.error.log warn;

    # ---------- 反代到 RustFS ----------
    location / {
        proxy_pass http://127.0.0.1:19000;

        # ⚠️ 关键：S3 签名校验依赖 Host 头，必须透传
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # 大文件流式下载，不缓冲
        proxy_buffering off;
        proxy_cache     off;

        # 长上传 / 下载超时
        proxy_connect_timeout 60s;
        proxy_send_timeout    1800s;
        proxy_read_timeout    1800s;
    }
}
