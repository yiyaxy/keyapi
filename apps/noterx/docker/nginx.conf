# NoteRx frontend nginx config (inside the noterx-frontend container).
# This sits behind the host's nginx (which terminates SSL).

server {
    listen 80;
    server_name _;

    # NoteRx accepts up to ~300 MB videos; keep this in sync with backend
    # MAX_VIDEO_UPLOAD_MB and the host nginx.
    client_max_body_size 300m;

    # SPA assets + client-side routes. Vite's `base: '/app/'` means
    # index.html points to /app/assets/<hash>.js, so the dist is placed
    # under /usr/share/nginx/html/app/ in the Dockerfile.
    location /app/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /app/index.html;
    }

    # /app without trailing slash — let the browser into the SPA cleanly.
    location = /app {
        return 301 /app/;
    }

    # Everything else (including /, /research, /terms, /privacy, /admin,
    # /api/*, /api/auth/token-login) is owned by the FastAPI backend.
    location / {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;

        # Diagnose runs are multi-agent and can take minutes;
        # don't let nginx kill the connection mid-stream.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering    off;
    }
}
